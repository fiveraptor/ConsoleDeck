name: Build & Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install pyserial pypresence requests rich pyinstaller pystray pillow

      - name: Build consoledeck.exe
        run: |
          pyinstaller --onefile --noconsole `
            --hidden-import serial.tools.list_ports `
            --hidden-import pystray._win32 `
            --collect-all PIL `
            --icon=ConsoleDeck.ico `
            --name consoledeck `
            main.py

      - name: Build consoledeck-config.exe
        run: |
          pyinstaller --onefile `
            --hidden-import serial.tools.list_ports `
            --icon=ConsoleDeck.ico `
            --name consoledeck-config `
            cli.py

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Build installer
        run: iscc /DAppVersion=${{ github.ref_name }} installer.iss

      - name: Package portable zip
        run: |
          New-Item -ItemType Directory release
          Copy-Item dist\consoledeck.exe release\
          Copy-Item dist\consoledeck-config.exe release\
          Copy-Item config.default.json release\config.json
          Copy-Item ConsoleDeck.ico release\
          Copy-Item console_deck_v2_arduino_code -Recurse release\arduino
          Compress-Archive -Path release\* -DestinationPath "ConsoleDeck-${{ github.ref_name }}-portable.zip"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ConsoleDeck-*-portable.zip
            Output\ConsoleDeck-Setup-*.exe
          generate_release_notes: true
