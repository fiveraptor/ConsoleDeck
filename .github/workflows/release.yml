name: Build & Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish
        run: |
          dotnet publish ConsoleDeckApp\ConsoleDeck\ConsoleDeck.csproj `
            -c Release -r win-x64 --self-contained `
            -p:PublishSingleFile=true `
            -p:EnableCompressionInSingleFile=true `
            -p:Version=${{ github.ref_name }} `
            -o dist

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build installer
        run: iscc /DAppVersion=${{ github.ref_name }} installer.iss

      - name: Package portable zip
        run: |
          New-Item -ItemType Directory release | Out-Null
          Copy-Item dist\ConsoleDeck.exe      release\
          Copy-Item config.default.json        release\config.json
          Copy-Item console_deck_v2_arduino_code -Recurse release\arduino
          Compress-Archive -Path release\* `
            -DestinationPath "ConsoleDeck-${{ github.ref_name }}-portable.zip"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ConsoleDeck-*-portable.zip
            Output\ConsoleDeck-Setup-*.exe
          generate_release_notes: true
